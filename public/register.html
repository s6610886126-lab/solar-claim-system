<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Claim - สมัครสมาชิก</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="login-page">
        <div class="login-container animate-in">
            <div class="login-brand">
                <div class="solar-icon">☀️</div>
                <h1>Solar <span>Claim</span></h1>
                <p>สร้างบัญชีใหม่เพื่อเริ่มต้นใช้งาน</p>
            </div>
            <div class="login-card">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regName">ชื่อ-นามสกุล</label>
                        <input type="text" id="regName" class="form-control" placeholder="กรอกชื่อ-นามสกุล" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">อีเมล</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPhone">เบอร์โทรศัพท์</label>
                        <input type="tel" id="regPhone" class="form-control" placeholder="08x-xxx-xxxx" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">รหัสผ่าน</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="กำหนดรหัสผ่าน" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="regBtn">
                        ✨ สมัครสมาชิก
                    </button>
                </form>
                <div class="login-divider">มีบัญชีอยู่แล้ว?</div>
                <a href="/" class="btn btn-ghost" style="text-decoration:none;display:flex;align-items:center;justify-content:center;">
                    🔙 กลับไปหน้าเข้าสู่ระบบ
                </a>
            </div>
        </div>
    </div>
    <script src="/js/register.js"></script>
</body>

</html>
