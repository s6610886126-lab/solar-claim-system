<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarCare - Register</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>

<body>
    <div class="login-page">
        <div class="login-container animate-in">
            <div class="login-brand">
                <div class="solar-icon" style="background: rgba(245, 158, 11, 0.08); border: 1.5px solid rgba(245, 158, 11, 0.3); border-radius: 20px; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.2);">
                    <svg viewBox="0 0 32 32" width="46" height="46">
                        <circle cx="16" cy="16" r="6" fill="#F59E0B"/>
                        <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
                            <line x1="16" y1="1" x2="16" y2="6"/>
                            <line x1="16" y1="26" x2="16" y2="31"/>
                            <line x1="1" y1="16" x2="6" y2="16"/>
                            <line x1="26" y1="16" x2="31" y2="16"/>
                            <line x1="5.4" y1="5.4" x2="8.9" y2="8.9"/>
                            <line x1="23.1" y1="23.1" x2="26.6" y2="26.6"/>
                            <line x1="5.4" y1="26.6" x2="8.9" y2="23.1"/>
                            <line x1="23.1" y1="8.9" x2="26.6" y2="5.4"/>
                        </g>
                    </svg>
                </div>
                <h1 style="font-size: 2.2rem; font-weight: 800; color: #ffffff; letter-spacing: -1px;">Solar<span style="color: #fbbf24;">Care</span></h1>
                <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 4px;">Create a new account to get started</p>
            </div>
            <div class="login-card">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Phone Number</label>
                        <input type="tel" id="regPhone" class="form-control" placeholder="08x-xxx-xxxx" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="Choose a password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="regBtn">
                        ✨ Register
                    </button>
                </form>
                <div class="login-divider">Already have an account?</div>
                <a href="/" class="btn btn-ghost" style="text-decoration:none;display:flex;align-items:center;justify-content:center;">
                    🔙 Back to Login
                </a>
            </div>
        </div>
    </div>
    <script src="/js/register.js"></script>
</body>

</html>
