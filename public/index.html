<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ระบบเคลมอุปกรณ์โซลาร์เซลล์ - Solar Equipment Claim System">
    <title>SolarCare - เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>

<body>
    <!-- Ambient Background Glow -->
    <div class="login-bg-glow glow-top-left"></div>
    <div class="login-bg-glow glow-bottom-right"></div>

    <div class="login-page">
        <div class="login-container animate-in">
            <div class="login-brand">
                <div class="solar-icon">
                    <svg viewBox="0 0 32 32" width="42" height="42">
                        <circle cx="16" cy="16" r="6" fill="#F59E0B"/>
                        <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
                            <line x1="16" y1="1" x2="16" y2="6"/>
                            <line x1="16" y1="26" x2="16" y2="31"/>
                            <line x1="1" y1="16" x2="6" y2="16"/>
                            <line x1="26" y1="16" x2="31" y2="16"/>
                            <line x1="5.4" y1="5.4" x2="8.9" y2="8.9"/>
                            <line x1="23.1" y1="23.1" x2="26.6" y2="26.6"/>
                            <line x1="5.4" y1="26.6" x2="8.9" y2="23.1"/>
                            <line x1="23.1" y1="8.9" x2="26.6" y2="5.4"/>
                        </g>
                    </svg>
                </div>
                <h1>Solar<span>Care</span></h1>
                <p>ระบบจัดการเคลมอุปกรณ์โซลาร์เซลล์</p>
            </div>
            <div class="login-card">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">ชื่อผู้ใช้ / อีเมล</label>
                        <div class="input-group-custom">
                            <input type="text" id="username" class="form-control" placeholder="ชื่อผู้ใช้ หรือ อีเมล" required autocomplete="username">
                            <span class="input-icon-left">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                            </span>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="password">รหัสผ่าน</label>
                        <div class="input-group-custom">
                            <input type="password" id="password" class="form-control" placeholder="รหัสผ่านของคุณ" required autocomplete="current-password">
                            <span class="input-icon-left">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                    <path d="M7 11V7a5 5 0 0110 0v4" />
                                </svg>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right: 6px;">
                            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" />
                        </svg>
                        เข้าสู่ระบบ
                    </button>
                </form>

                <div style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:#94a3b8;">
                    ยังไม่มีบัญชี? <a href="/register.html" style="color:#fbbf24;font-weight:600;text-decoration:none;transition:color 0.2s;" onmouseover="this.style.color='#f59e0b'" onmouseout="this.style.color='#fbbf24'">สมัครสมาชิกที่นี่</a>
                </div>
            </div>
            <p style="text-align:center;margin-top:2rem;font-size:0.8rem;color:var(--text-muted)">
                Solar Claim System v1.0 — Powered by ☀️
            </p>
        </div>
    </div>
    <script>
        // Check if already logged in
        if (localStorage.getItem('solar_user')) {
            window.location.href = '/dashboard';
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            btn.disabled = true;
            btn.innerHTML = 'กำลังเข้าสู่ระบบ...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('solar_user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    alert(data.message || 'เข้าสู่ระบบไม่สำเร็จ');
                    btn.disabled = false;
                    btn.innerHTML = 'เข้าสู่ระบบ';
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                btn.disabled = false;
                btn.innerHTML = 'เข้าสู่ระบบ';
            }
        });

    </script>
</body>

</html>
