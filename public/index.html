<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ระบบเคลมอุปกรณ์โซลาร์เซลล์ - Solar Equipment Claim System">
    <title>Solar Claim System - เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="login-page">
        <div class="login-container animate-in">
            <div class="login-brand">
                <div class="solar-icon">☀️</div>
                <h1>Solar <span>Claim</span></h1>
                <p>ระบบจัดการเคลมอุปกรณ์โซลาร์เซลล์</p>
            </div>
            <div class="login-card">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">ชื่อผู้ใช้ / อีเมล</label>
                        <input type="text" id="username" class="form-control" placeholder="ชื่อผู้ใช้ หรือ อีเมล">
                    </div>
                    <div class="form-group">
                        <label for="password">รหัสผ่าน</label>
                        <input type="password" id="password" class="form-control" placeholder="รหัสผ่านของคุณ">
                    </div>
                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" />
                        </svg>
                        เข้าสู่ระบบ
                    </button>
                </form>
                <div class="login-divider">หรือ</div>
                <button class="btn btn-ghost demo-btn" id="demoBtn" onclick="loginDemo()">
                    🚀 เข้าใช้งานโหมด Demo
                </button>
                <div style="text-align:center;margin-top:1rem;font-size:0.9rem;">
                    ยังไม่มีบัญชี? <a href="/register.html" style="color:var(--primary);font-weight:600;text-decoration:none;">สมัครสมาชิกที่นี่</a>
                </div>
            </div>
            <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:var(--text-muted)">
                Solar Claim System v1.0 — Powered by ☀️
            </p>
        </div>
    </div>
    <script>
        // Check if already logged in
        if (localStorage.getItem('solar_user')) {
            window.location.href = '/dashboard';
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            btn.disabled = true;
            btn.innerHTML = 'กำลังเข้าสู่ระบบ...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('solar_user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    alert(data.message || 'เข้าสู่ระบบไม่สำเร็จ');
                    btn.disabled = false;
                    btn.innerHTML = 'เข้าสู่ระบบ';
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                btn.disabled = false;
                btn.innerHTML = 'เข้าสู่ระบบ';
            }
        });

        function loginDemo() {
            localStorage.setItem('solar_user', JSON.stringify({ name: 'System Admin', email: 'admin@solar.com', role: 'admin' }));
            window.location.href = '/dashboard';
        }
    </script>
</body>

</html>
